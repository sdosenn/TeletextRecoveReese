name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_FILE: TeletextRecoveReese/TeletextRecoveReese.csproj
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: >-
          dotnet publish $env:PROJECT_FILE
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output "$env:RUNNER_TEMP/publish"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create ZIP package
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP/TeletextRecoveReese-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/*" -DestinationPath $package

      - name: Store Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ${{ runner.temp }}/TeletextRecoveReese-${{ env.RELEASE_TAG }}-win-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >-
          dotnet publish "$PROJECT_FILE"
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "$RUNNER_TEMP/publish"
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Assemble AppDir
        run: |
          app_dir="$RUNNER_TEMP/TeletextRecoveReese.AppDir"
          install -d "$app_dir/usr/bin"
          install -d "$app_dir/usr/share/applications"
          install -d "$app_dir/usr/share/icons"
          cp -a "$RUNNER_TEMP/publish/." "$app_dir/usr/bin/"
          install -Dm755 Packaging/linux/AppRun "$app_dir/AppRun"
          install -Dm644 Packaging/linux/TeletextRecoveReese.desktop "$app_dir/TeletextRecoveReese.desktop"
          install -Dm644 Packaging/linux/TeletextRecoveReese.desktop "$app_dir/usr/share/applications/TeletextRecoveReese.desktop"
          install -Dm644 TeletextRecoveReese/Assets/Icons/app-icon.png "$app_dir/TeletextRecoveReese.png"
          cp -a TeletextRecoveReese/Assets/Icons/hicolor "$app_dir/usr/share/icons/"
          chmod +x "$app_dir/usr/bin/TeletextRecoveReese"

      - name: Build AppImage
        run: |
          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          output="$RUNNER_TEMP/TeletextRecoveReese-$RELEASE_TAG-linux-x64.AppImage"
          curl --fail --location --retry 3 --output "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          ARCH=x86_64 VERSION="$RELEASE_TAG" "$tool" --appimage-extract-and-run \
            "$RUNNER_TEMP/TeletextRecoveReese.AppDir" "$output"
          chmod +x "$output"

      - name: Store Linux package
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ${{ runner.temp }}/TeletextRecoveReese-${{ env.RELEASE_TAG }}-linux-x64.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-x64
            architecture: Intel
            package_suffix: macos-x64
          - runtime: osx-arm64
            architecture: Apple-Silicon
            package_suffix: macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: >-
          dotnet publish "$PROJECT_FILE"
          --configuration Release
          --runtime "$RUNTIME"
          --self-contained true
          --output "$RUNNER_TEMP/publish"
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create application bundle
        run: |
          app="$RUNNER_TEMP/TeletextRecoveReese.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -a "$RUNNER_TEMP/publish/." "$app/Contents/MacOS/"
          cp Packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp TeletextRecoveReese/Assets/Icons/app-icon.icns "$app/Contents/Resources/app-icon.icns"
          chmod +x "$app/Contents/MacOS/TeletextRecoveReese"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $RELEASE_TAG" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"

      - name: Create ZIP package
        env:
          PACKAGE_SUFFIX: ${{ matrix.package_suffix }}
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent TeletextRecoveReese.app \
            "TeletextRecoveReese-$RELEASE_TAG-$PACKAGE_SUFFIX.zip"

      - name: Store macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package_suffix }}
          path: ${{ runner.temp }}/TeletextRecoveReese-${{ env.RELEASE_TAG }}-${{ matrix.package_suffix }}.zip
          if-no-files-found: error

  release:
    name: Attach packages to GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
